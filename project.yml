name: MouseBattery
options:
  bundleIdPrefix: com.mousebattery
  deploymentTarget:
    macOS: "12.0"
  xcodeVersion: "15.0"

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "12.0"

targets:
  MouseBattery:
    type: application
    platform: macOS
    sources:
      - MouseBattery
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mousebattery.app
        INFOPLIST_FILE: MouseBattery/Info.plist
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        ENABLE_HARDENED_RUNTIME: NO
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: MouseBattery/Info.plist
      properties:
        CFBundleName: MouseBattery
        CFBundleDisplayName: Mouse Battery
        CFBundleIdentifier: com.mousebattery.app
        CFBundleVersion: "1"
        CFBundleShortVersionString: "1.0.0"
        CFBundlePackageType: APPL
        CFBundleExecutable: MouseBattery
        LSMinimumSystemVersion: "12.0"
        LSUIElement: true
        NSPrincipalClass: NSApplication
        NSHighResolutionCapable: true
